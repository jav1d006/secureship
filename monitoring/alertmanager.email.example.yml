# Copy, fill in the three CHANGE_ME values, then:
#   kubectl -n secureship create secret generic alertmanager-config --from-file=alertmanager.yml=alertmanager.email.yml
#   kubectl -n secureship rollout restart deploy/alertmanager
# Never commit the filled-in file (it holds an SMTP password and your address).
global:
  smtp_smarthost: smtp.gmail.com:587          # any SMTP server; Gmail needs an "app password"
  smtp_from: CHANGE_ME_SENDER@gmail.com
  smtp_auth_username: CHANGE_ME_SENDER@gmail.com
  smtp_auth_password: CHANGE_ME_APP_PASSWORD
  smtp_require_tls: true
route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: email
    email_configs:
      - to: CHANGE_ME_RECIPIENT@example.com
        send_resolved: true
