# Local stack: nginx edge -> frontend + API, worker, Postgres, Redis. Dev-only credentials.
#   docker compose up --build   ->   http://localhost:8080
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app: &app
  <<: *hardened
  build: ./backend
  image: secureship-backend:dev
  environment:
    DATABASE_URL: postgresql://secureship:dev-only@postgres:5432/secureship
    REDIS_URL: redis://redis:6379/0
    REDIS_PASSWORD: dev-only
    CORS_ORIGINS: "http://localhost:8080"
    WORK_DIR: /tmp/work
  tmpfs: [/tmp]
  depends_on: [postgres, redis]

services:
  nginx:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/headers.conf:/etc/nginx/headers.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
    tmpfs: [/tmp]
    depends_on: [backend, frontend]
  frontend:
    <<: *hardened
    build: ./frontend
    image: secureship-frontend:dev
    tmpfs: [/tmp, /app/.next/cache]
    mem_limit: 256m
  backend:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]    # direct access for debugging; users go through nginx
    mem_limit: 512m
  worker:
    <<: *app
    command: ["python", "-m", "app.run_worker"]
    mem_limit: 1g
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: secureship, POSTGRES_PASSWORD: dev-only, POSTGRES_DB: secureship}
    volumes: [pgdata:/var/lib/postgresql/data]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--requirepass", "dev-only"]
    <<: *hardened
    tmpfs: [/data]

  # Optional monitoring stack: docker compose --profile monitoring up
  #   Prometheus http://localhost:9090   Grafana http://localhost:3001 (admin / dev-only)
  prometheus:
    <<: *hardened
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=2d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    tmpfs: ["/prometheus:uid=65534,gid=65534"]
    user: "65534:65534"
    depends_on: [backend]
  grafana:
    <<: *hardened
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: dev-only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs: ["/var/lib/grafana:uid=472,gid=472", "/tmp"]
    user: "472:472"
    depends_on: [prometheus]

volumes:
  pgdata:
