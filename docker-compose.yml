# Local dev stack (API + worker + Postgres + Redis). Dev-only credentials.
x-app: &app
  build: ./backend
  image: secureship-backend:dev
  environment:
    DATABASE_URL: postgresql://secureship:dev-only@postgres:5432/secureship
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: "http://localhost:3000"
    WORK_DIR: /tmp/work
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on: [postgres, redis]

services:
  backend:
    <<: *app
    ports: ["8000:8000"]
    mem_limit: 512m
  worker:
    <<: *app
    command: ["rq", "worker", "scans", "--url", "redis://redis:6379/0"]
    mem_limit: 768m
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: secureship, POSTGRES_PASSWORD: dev-only, POSTGRES_DB: secureship}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", ""]

volumes:
  pgdata:
