# Local stack: nginx edge -> frontend + API, worker, Postgres, Redis. Dev-only credentials.
#   docker compose up --build   ->   http://localhost:8080
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app: &app
  <<: *hardened
  build: ./backend
  image: secureship-backend:dev
  environment:
    DATABASE_URL: postgresql://secureship:dev-only@postgres:5432/secureship
    REDIS_URL: redis://redis:6379/0
    REDIS_PASSWORD: dev-only
    CORS_ORIGINS: "http://localhost:8080"
    WORK_DIR: /tmp/work
  tmpfs: [/tmp]
  depends_on: [postgres, redis]

services:
  nginx:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/headers.conf:/etc/nginx/headers.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
    tmpfs: [/tmp]
    depends_on: [backend, frontend]
  frontend:
    <<: *hardened
    build: ./frontend
    image: secureship-frontend:dev
    tmpfs: [/tmp, /app/.next/cache]
    mem_limit: 256m
  backend:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]    # direct access for debugging; users go through nginx
    mem_limit: 512m
  worker:
    <<: *app
    command: ["python", "-m", "app.run_worker"]
    mem_limit: 1g
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: secureship, POSTGRES_PASSWORD: dev-only, POSTGRES_DB: secureship}
    volumes: [pgdata:/var/lib/postgresql/data]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--requirepass", "dev-only"]
    <<: *hardened
    tmpfs: [/data]

volumes:
  pgdata:
