# GENERATED by monitoring/build_k8s.py from monitoring/ - do not edit by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: secureship
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: secureship-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8000"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  rules.yml: |
    groups:
      - name: secureship
        rules:
          - alert: BackendDown
            expr: up{job="secureship-backend"} == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "SecureShip API is not scrapeable"
              description: "Prometheus cannot reach backend:8000/metrics for 2 minutes."

          - alert: DependencyDown
            expr: secureship_dependency_up == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "{{ $labels.dependency }} is unreachable from the API"
              description: "Scans cannot be created or finished while this is down."

          - alert: ScanQueueBacklog
            expr: secureship_queue_length > 30
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "More than 30 scans are waiting"
              description: "The queue holds {{ $value }} scans (limit MAX_QUEUE=50, then new scans get 503)."

          - alert: WorkerNotProcessing
            expr: secureship_oldest_queued_seconds > 600
            for: 5m
            labels: {severity: critical}
            annotations:
              summary: "The oldest queued scan has waited over 10 minutes"
              description: "The worker is probably down, crash-looping or out of memory (OOMKilled)."

          - alert: HighScanFailureRate
            expr: |
              sum(secureship_scans_finished_last_hour{status="failed"}) / sum(secureship_scans_finished_last_hour) > 0.3
              and on()
              sum(secureship_scans_finished_last_hour) >= 5
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "More than 30% of scans failed in the last hour"
              description: "Check worker logs and the per-scanner `errors` in failing results."

          - alert: SlowScans
            expr: secureship_scan_duration_seconds_avg > 120
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "Average scan takes over 2 minutes"
              description: "Close to SCAN_TIMEOUT_SEC; consider more worker CPU/memory."

          - alert: HighErrorRate
            expr: |
              sum(rate(secureship_http_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(secureship_http_requests_total[5m])), 0.001) > 0.05
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "More than 5% of API responses are 5xx"

          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le, route) (rate(secureship_http_request_seconds_bucket[5m]))) > 2
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "p95 latency above 2s on {{ $labels.route }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: secureship
data:
  alertmanager.yml: |
    # Default: alerts are evaluated and visible in Prometheus/Alertmanager but sent nowhere.
    # To get e-mail, create the Secret `alertmanager-config` from alertmanager.email.example.yml (see docs/RUNBOOK.md).
    route:
      receiver: "null"
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"
---
