apiVersion: v1
kind: Namespace
metadata:
  name: secureship
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secureship-data
  namespace: secureship
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: secureship
spec:
  replicas: 1            # SQLite = single writer
  strategy:
    type: Recreate       # RWO volume, never two pods at once
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      nodeSelector:
        kubernetes.io/hostname: node1   # node2 has only 1.6 GB RAM
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: ghcr.io/jav1d006/secureship-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - {name: CORS_ORIGINS, value: "http://secureship.local"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: secureship-data}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: secureship
spec:
  selector: {app: backend}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secureship
  namespace: secureship
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
spec:
  ingressClassName: nginx
  rules:
    - host: secureship.local
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: backend, port: {number: 8000}}}}
          - {path: /health, pathType: Prefix, backend: {service: {name: backend, port: {number: 8000}}}}
---
# Default deny everything in the namespace...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: secureship
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# ...then allow only: ingress-nginx -> backend:8000, and DNS out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow
  namespace: secureship
spec:
  podSelector:
    matchLabels: {app: backend}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
