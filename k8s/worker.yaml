apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: secureship}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      nodeSelector: {kubernetes.io/hostname: node1}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/jav1d006/secureship-backend:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["rq", "worker", "scans", "--url", "$(REDIS_URL)"]
          envFrom: [{secretRef: {name: db-secret}}]
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: WORK_DIR, value: /tmp/work}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
