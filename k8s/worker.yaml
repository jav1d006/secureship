apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: secureship}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: true   # only used in SANDBOX_MODE=job (Role: create/get/delete Jobs)
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: node1}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/jav1d006/secureship-backend:latest
          imagePullPolicy: Always
          workingDir: /srv
          command: ["python", "-m", "app.run_worker"]
          envFrom: [{secretRef: {name: db-secret}}]
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: WORK_DIR, value: /tmp/work}
            - {name: HOME, value: /tmp}
            - {name: SANDBOX_MODE, value: job}   # every scan runs in its own Job (docs/SANDBOX.md); "local" = in-pod fallback
            - {name: SANDBOX_IMAGE, value: "ghcr.io/jav1d006/secureship-backend:latest"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-secret, key: REDIS_PASSWORD, optional: true}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # The Trivy vulnerability DB is copied here at start (the root fs is read-only). It is large,
            # so it gets its own volume and limit: sharing /tmp made pods exceed 1Gi and get evicted.
            - {name: trivy-cache, mountPath: /tmp/trivy-cache}
            - {name: scan-work, mountPath: /scan-work}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
        - {name: trivy-cache, emptyDir: {sizeLimit: 3Gi}}
        - {name: scan-work, persistentVolumeClaim: {claimName: scan-work}}
