apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: secureship}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      nodeSelector: {kubernetes.io/hostname: node2}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          envFrom: [{secretRef: {name: db-secret}}]
          env: [{name: PGDATA, value: /var/lib/postgresql/data/pgdata}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "secureship"]}
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: secureship}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: secureship}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      nodeSelector: {kubernetes.io/hostname: node2}
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: secureship}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-backend-to-data, namespace: secureship}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [postgres, redis]}]
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: backend}}}]
