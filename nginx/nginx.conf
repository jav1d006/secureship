# SecureShip edge (dev/compose). In Kubernetes ingress-nginx plays this role; the same rules
# live there as Ingress annotations. Runs unprivileged: image nginxinc/nginx-unprivileged.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    autoindex off;

    # Slowloris / oversized-request protection. 26m = 25 MB API upload limit + multipart overhead.
    client_header_timeout 10s;
    client_body_timeout 60s;
    send_timeout 30s;
    client_max_body_size 26m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rate limits per client IP. The keyed maps leave the key empty (= not limited) for other requests.
    map "$request_method:$uri" $scan_key { "POST:/api/v1/scans" $binary_remote_addr; default ""; }
    map "$request_method:$uri" $keys_key { "POST:/api/v1/keys"  $binary_remote_addr; default ""; }
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $scan_key           zone=scans:10m   rate=6r/m;
    limit_req_zone $keys_key           zone=keys:10m    rate=3r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream api { server backend:8000; keepalive 16; }
    upstream web { server frontend:3000; keepalive 16; }

    # Unknown Host header (scanners hitting the bare IP): drop the connection.
    server {
        listen 8080 default_server;
        return 444;
    }

    server {
        listen 8080;
        server_name localhost 127.0.0.1 secureship.local;

        limit_conn perip 30;
        if ($request_method !~ ^(GET|HEAD|POST|DELETE|OPTIONS)$) { return 405; }

        # Hidden files and directories (.git, .env, .htaccess, .DS_Store ...) except /.well-known/.
        location ~ /\.(?!well-known/) { return 404; }

        # Backup, config, key and source artefacts must never be served.
        location ~* \.(?:bak|old|orig|save|swp|sql|sqlite3?|db|log|ini|conf|cfg|pem|key|crt|p12|pfx|tfstate|tfvars|ya?ml|toml|py|pyc|sh|md|lock|env)$ { return 404; }

        # Operational endpoints stay inside the cluster.
        location = /metrics { return 404; }
        location = /ready   { return 404; }

        location = /health {
            include proxy.conf;
            proxy_pass http://api;
            access_log off;
        }

        # ^~ keeps the regex locations above from applying to API paths.
        location ^~ /api/ {
            limit_req zone=general burst=40 nodelay;
            limit_req zone=scans burst=3 nodelay;
            limit_req zone=keys burst=2 nodelay;
            include proxy.conf;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_pass http://api;
            # The API sets its own security headers (incl. CSP); drop duplicates before adding ours.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            include headers.conf;
        }

        # Web UI (Next.js). robots.txt and /.well-known/security.txt come from frontend/public.
        location / {
            limit_req zone=general burst=60 nodelay;
            include proxy.conf;
            proxy_pass http://web;
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Content-Security-Policy;
            include headers.conf;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        }
    }
}
